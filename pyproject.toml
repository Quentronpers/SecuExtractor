[project]
name = "securscope-catalog"
version = "0.1.0"
description = "Measured LLM extraction of IP-camera power specs from manufacturer datasheets, with source quotes and deterministic checks."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "streamlit>=1.38",
]

[project.scripts]
catalog = "catalog.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "types-requests>=2.32",
]
# Repli JavaScript de l'acquisition : hors de l'image de la démo.
acquisition = [
    "playwright>=1.47",
]

[tool.uv]
default-groups = ["dev", "acquisition"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog"]

# Formatage et lint : ruff remplace black + isort + flake8 (+ docstrings)
# du standard SecurScope, en un seul outil.
[tool.ruff]
line-length = 88
target-version = "py312"
src = ["catalog", "demo", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "D"]
# D401 (mode impératif) ne connaît que l'anglais : docstrings en français.
ignore = ["D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"tests/*" = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["catalog", "demo"]

[tool.mypy]
python_version = "3.12"
packages = ["catalog", "demo", "tests"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["bs4.*", "pdfplumber.*", "streamlit.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
