[project]
name = "securscope-catalog"
version = "0.1.0"
description = "Pipeline d'extraction des caractéristiques techniques d'équipements depuis les notices constructeur."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "playwright>=1.47",
    "pdfplumber>=0.11",
    "anthropic>=0.40",
    "pydantic>=2.9",
    "streamlit>=1.38",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalog"]
