services:
  # Conteneur de développement, toujours démarré : les hooks de Claude Code
  # et les vérifications y passent par `docker exec dev_catalog`.
  dev:
    build: .
    container_name: dev_catalog
    # Sur la machine de développement, seul le bridge par défaut sort vers
    # Internet ; l'acquisition en a besoin.
    network_mode: bridge
    volumes:
      - .:/app
    working_dir: /app
    environment:
      # Contact du User-Agent de l'acquisition (CLAUDE.md, « Cadre à respecter »).
      SECURSCOPE_CONTACT: securscope.catalogue@gmail.com
    command: ["sleep", "infinity"]

  catalog:
    build: .
    network_mode: bridge
    volumes:
      - .:/app
    working_dir: /app
    environment:
      SECURSCOPE_CONTACT: securscope.catalogue@gmail.com
    command: ["python", "-m", "catalog.cli", "--help"]

  # Interface de relecture : prévue, encore une coquille (docs/pipeline.md).
  review:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "catalog/review/app.py", "--server.address=0.0.0.0"]
