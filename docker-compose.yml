services:
  # Conteneur de développement, toujours démarré : les hooks de Claude Code
  # et les vérifications y passent par `docker exec dev_catalog`.
  dev:
    build: .
    container_name: dev_catalog
    volumes:
      - .:/app
    working_dir: /app
    command: ["sleep", "infinity"]

  catalog:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    command: ["python", "-m", "catalog.cli", "--help"]

  review:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "catalog/review/app.py", "--server.address=0.0.0.0"]
